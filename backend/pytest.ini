[pytest]
testpaths = /app/tests
pythonpath = /app /app/backend
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    -q
    --strict-markers
    --tb=short

markers =
    slow: takes more than a couple of seconds
    integration: needs the full docker stack

filterwarnings =
    ignore::DeprecationWarning:pydantic.*
