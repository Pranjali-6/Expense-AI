user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # NOTE: request URIs are logged, but the API never places financial or
    # personal values in a path or query string (see plan: logging policy).
    log_format  main  '$remote_addr - $status "$request_method $uri" '
                      '$body_bytes_sent "$http_referer" rt=$request_time '
                      'rid=$http_x_request_id';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml application/xml+rss text/javascript
                      image/svg+xml;

    # Statement uploads: multiple PDFs in one request.
    client_max_body_size 60m;
    client_body_timeout  120s;

    # Rate limiting zones (defence in depth; the API enforces its own limits).
    limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m  rate=2r/s;
    limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=2r/s;

    include /etc/nginx/conf.d/*.conf;
}
