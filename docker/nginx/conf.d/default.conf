# =============================================================================
# Upstreams are resolved per request, not once at startup.
#
# nginx resolves a hostname in a static `upstream` block exactly once, when the
# config loads, and caches the address forever. Containers get a new IP every
# time they are recreated, so a plain `upstream { server api:8000; }` means every
# redeploy of the API returns 502 until nginx itself is restarted — the proxy
# faithfully dialling an address that no longer exists.
#
# Using a variable in proxy_pass forces nginx to consult the resolver on each
# request instead. 127.0.0.11 is Docker's embedded DNS.
#
# The cost is upstream keepalive, which nginx cannot pool across a dynamically
# resolved address. At this workload that is a rounding error; surviving a
# deploy is not.
# =============================================================================

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Re-resolved per request thanks to the variables below.
    set $api_backend      "api:8000";
    set $frontend_backend "frontend:3000";

    # --- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options     "nosniff"            always;
    add_header X-Frame-Options            "DENY"               always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"        always;

    # Financial data must never be cached by an intermediary.
    add_header Cache-Control "no-store" always;

    # --- Proxy defaults -----------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    # --- Proxy healthcheck --------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- Job progress stream (Server-Sent Events) ---------------------------
    # Buffering must be off or the client never sees a stage transition.
    location ~ ^/api/v1/jobs/[^/]+/events$ {
        proxy_pass http://$api_backend$request_uri;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  1h;
        proxy_set_header    Connection "";
        chunked_transfer_encoding off;
    }

    # --- Statement upload ---------------------------------------------------
    location = /api/v1/statements/upload {
        limit_req zone=upload_zone burst=5 nodelay;
        proxy_pass http://$api_backend$request_uri;
        proxy_request_buffering off;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # --- Authentication -----------------------------------------------------
    location /api/v1/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://$api_backend$request_uri;
    }

    # --- API ----------------------------------------------------------------
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://$api_backend$request_uri;
        proxy_read_timeout 120s;
    }

    location = /openapi.json { proxy_pass http://$api_backend$request_uri; }
    location /docs          { proxy_pass http://$api_backend$request_uri; }
    location /redoc         { proxy_pass http://$api_backend$request_uri; }

    # --- Frontend -----------------------------------------------------------
    location /_next/webpack-hmr {
        proxy_pass http://$frontend_backend$request_uri;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://$frontend_backend$request_uri;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
